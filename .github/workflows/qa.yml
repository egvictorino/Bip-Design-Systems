name: QA Environment

on:
  push:
    branches: [qa]
  pull_request:
    branches: [qa]

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm --filter @bip-design-systems/ui-components lint

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [lint]
    
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm --filter @bip-design-systems/shared-utils test
          pnpm --filter @bip-design-systems/ui-components test

      - name: Build all packages
        run: |
          pnpm --filter @bip-design-systems/shared-utils build
          pnpm --filter @bip-design-systems/ui-components build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: qa-build
          path: packages/*/dist
          retention-days: 7

  e2e-consumer:
    name: E2E — Published Package Smoke Test
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds, pnpm-packs the real tarball, installs it as a standalone (non-workspace)
      # project in e2e/consumer-app, and asserts on computed styles — catches the class of
      # bug a `pnpm --filter` workspace link can't (see hotfix/design-tokens-not-bundled).
      - name: Run consumer smoke test
        run: pnpm test:e2e

  deploy-storybook-qa:
    name: Deploy Storybook QA
    runs-on: ubuntu-latest
    needs: [build, e2e-consumer]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @bip-design-systems/ui-components build-storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Storybook build
        uses: actions/upload-artifact@v6
        with:
          name: storybook-qa
          path: packages/ui-components/storybook-static
          retention-days: 7
        # Un repo solo tiene un sitio de GitHub Pages, ya usado por production.yml — qa no
        # tiene URL propia. El artifact es descargable desde la pestaña Actions del run.