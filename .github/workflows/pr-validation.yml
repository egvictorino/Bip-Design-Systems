name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check PR target branch
        run: |
          TARGET="${{ github.base_ref }}"
          SOURCE="${{ github.head_ref }}"
          
          echo "📋 PR: $SOURCE → $TARGET"
          
          # Validar flujo de branches
          if [[ "$TARGET" == "main" ]] && [[ "$SOURCE" != "qa" ]] && [[ "$SOURCE" != "hotfix/"* ]]; then
            echo "❌ ERROR: Solo se puede mergear a 'main' desde 'qa' o 'hotfix/*'"
            echo "Tu PR es: $SOURCE → $TARGET"
            echo "Debe ser: qa → main  |  hotfix/* → main"
            exit 1
          fi

          if [[ "$TARGET" == "qa" ]] && [[ "$SOURCE" != "dev" ]] && [[ "$SOURCE" != "hotfix/"* ]] && [[ "$SOURCE" != "main" ]]; then
            echo "❌ ERROR: Solo se puede mergear a 'qa' desde 'dev', 'hotfix/*' o 'main'"
            echo "Tu PR es: $SOURCE → $TARGET"
            echo "Debe ser: dev → qa  |  hotfix/* → qa  |  main → qa"
            exit 1
          fi

          if [[ "$TARGET" == "dev" ]] && [[ "$SOURCE" != "feature/"* ]] && [[ "$SOURCE" != "hotfix/"* ]] && [[ "$SOURCE" != "main" ]]; then
            echo "❌ ERROR: Solo se puede mergear a 'dev' desde 'feature/*', 'hotfix/*' o 'main'"
            echo "Tu PR es: $SOURCE → $TARGET"
            echo "Debe ser: feature/* → dev  |  hotfix/* → dev  |  main → dev"
            exit 1
          fi

          echo "✅ Flujo de branches correcto"
      
      - name: Check PR title format
        env:
          # Passed via env instead of interpolated directly into the script:
          # a PR title is free text, and a title containing a literal quote,
          # backtick or $(...) breaks (or, more seriously, could inject into)
          # a `run:` block that embeds ${{ ... }} straight into the YAML.
          # env vars are passed as-is, with no re-parsing by the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|hotfix)(\(.+\))?:\ .+ ]]; then
            echo "⚠️ Recomendación: Usa conventional commits"
            echo "Ejemplo: feat(button): agregar variante outline"
          fi

  build-and-test:
    name: Build & Test PR
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint
        run: pnpm --filter @bip-design-systems/ui-components lint

      - name: Test
        run: |
          pnpm --filter @bip-design-systems/shared-utils test
          pnpm --filter @bip-design-systems/ui-components test

      - name: Build
        run: |
          pnpm --filter @bip-design-systems/shared-utils build
          pnpm --filter @bip-design-systems/ui-components build
      
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Build exitoso! Los cambios están listos para review.'
            })

  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    # Solo gatea feature/* → dev, que es donde nace un cambio real — dev → qa → main son
    # promociones del mismo código, no producen changesets nuevos.
    if: github.base_ref == 'dev'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'packages/*/src/**' | grep -q .; then
            pnpm exec changeset status --since="origin/${{ github.base_ref }}"
          else
            echo "No hay cambios bajo packages/*/src — no se requiere changeset."
          fi

  security-audit:
    name: Security Audit (PR → QA)
    runs-on: ubuntu-latest
    if: github.base_ref == 'qa'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

  visual-regression:
    name: Visual Regression (theme matrix)
    runs-on: ubuntu-latest
    # Corre dentro de la misma imagen que scripts/visual-docker.sh usa para regenerar
    # baselines en local — mismo Chromium, misma libc, cero deriva entre "pasa en mi
    # máquina" y "pasa en CI". El tag DEBE seguir a la versión de @playwright/test en
    # packages/ui-components/package.json (ver scripts/visual-docker.sh, que valida esto
    # automáticamente en local).
    container: mcr.microsoft.com/playwright:v1.62.1-jammy

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          # Store del contenedor Playwright, corre como root — no "~/.local/..." (la cache
          # action no expande ~ de forma confiable dentro de un job `container:`).
          path: /root/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-visual-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-visual-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-utils
        run: pnpm --filter @bip-design-systems/shared-utils build

      - name: Run visual regression
        working-directory: packages/ui-components
        run: pnpm exec playwright test --config=playwright.visual.config.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/ui-components/playwright-report/
            packages/ui-components/test-results/
          retention-days: 7