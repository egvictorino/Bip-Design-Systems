name: Development

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint ui-components
        run: pnpm --filter @bip-design-systems/ui-components lint

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Test
        run: |
          pnpm --filter @bip-design-systems/shared-utils test
          pnpm --filter @bip-design-systems/ui-components test

      - name: Build all packages
        run: |
          pnpm --filter @bip-design-systems/shared-utils build
          pnpm --filter @bip-design-systems/ui-components build

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dev-build
          path: packages/*/dist
          retention-days: 3

  deploy-storybook-dev:
    name: Deploy Storybook (Dev Preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Storybook
        run: pnpm --filter @bip-design-systems/ui-components build-storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
      
      - name: Upload Storybook build
        uses: actions/upload-artifact@v6
        with:
          name: storybook-dev
          path: packages/ui-components/storybook-static
          retention-days: 7
        # Un repo solo tiene un sitio de GitHub Pages, ya usado por production.yml — dev no
        # tiene URL propia. El artifact es descargable desde la pestaña Actions del run.