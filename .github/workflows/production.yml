name: Production Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Permite deploy manual

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-Production Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Security audit
        run: pnpm audit --audit-level=high
      
      - name: Lint (strict)
        run: pnpm --filter @bip-design-systems/ui-components lint
      
      - name: Test
        run: |
          pnpm --filter @bip-design-systems/shared-utils test
          pnpm --filter @bip-design-systems/ui-components test

      - name: Type check & build (validate)
        run: |
          pnpm --filter @bip-design-systems/shared-utils build
          pnpm --filter @bip-design-systems/ui-components build

  e2e-consumer:
    name: E2E — Published Package Smoke Test
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Builds, pnpm-packs the real tarball, installs it as a standalone (non-workspace)
      # project in e2e/consumer-app, and asserts on computed styles — catches the class of
      # bug a `pnpm --filter` workspace link can't (see hotfix/design-tokens-not-bundled).
      - name: Run consumer smoke test
        run: pnpm test:e2e

  build-production:
    name: Build Production
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-prod-${{ hashFiles('**/pnpm-lock.yaml') }}
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build packages (production mode)
        run: |
          NODE_ENV=production pnpm --filter @bip-design-systems/shared-utils build
          NODE_ENV=production pnpm --filter @bip-design-systems/ui-components build

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: packages/*/dist
          retention-days: 30

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: [build-production, e2e-consumer]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @bip-design-systems/shared-utils build
          pnpm --filter @bip-design-systems/ui-components build

      - name: Check if version already published
        id: version-check
        run: |
          UI_VERSION=$(node -p "require('./packages/ui-components/package.json').version")
          UTILS_VERSION=$(node -p "require('./packages/shared-utils/package.json').version")
          echo "ui_version=$UI_VERSION" >> $GITHUB_OUTPUT
          echo "utils_version=$UTILS_VERSION" >> $GITHUB_OUTPUT

          if npm view @bip-design-systems/ui-components@$UI_VERSION version 2>/dev/null; then
            echo "ui_already_published=true" >> $GITHUB_OUTPUT
            echo "⚠️ ui-components@$UI_VERSION already published — skipping"
          else
            echo "ui_already_published=false" >> $GITHUB_OUTPUT
            echo "✅ ui-components@$UI_VERSION not published yet — will publish"
          fi

          if npm view @bip-design-systems/shared-utils@$UTILS_VERSION version 2>/dev/null; then
            echo "utils_already_published=true" >> $GITHUB_OUTPUT
            echo "⚠️ shared-utils@$UTILS_VERSION already published — skipping"
          else
            echo "utils_already_published=false" >> $GITHUB_OUTPUT
            echo "✅ shared-utils@$UTILS_VERSION not published yet — will publish"
          fi

      - name: Publish @bip-design-systems/ui-components
        if: steps.version-check.outputs.ui_already_published == 'false'
        run: pnpm --filter @bip-design-systems/ui-components publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @bip-design-systems/shared-utils
        if: steps.version-check.outputs.utils_already_published == 'false'
        run: pnpm --filter @bip-design-systems/shared-utils publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-storybook-production:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-production
    if: github.event_name != 'pull_request'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Storybook
        run: pnpm --filter @bip-design-systems/ui-components build-storybook
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/ui-components/storybook-static
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: [deploy-storybook-production, publish-npm]
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./packages/ui-components/package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANGELOG_FILE="packages/ui-components/CHANGELOG.md"
          {
            echo "body<<CHANGELOG_EOF"
            awk -v ver="## [$VERSION]" '
              index($0, ver) == 1 { found=1; print; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$CHANGELOG_FILE"
            echo ""
            echo "### Recursos"
            echo "- [NPM](https://www.npmjs.com/package/@bip-design-systems/ui-components)"
            echo "- [Storybook](https://egvictorino.github.io/Bip-Design-Systems/)"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false